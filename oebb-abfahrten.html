<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ÖBB Abfahrten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E2001A;
      --red-dark: #b5001a;
      --black: #0d0d0d;
      --panel: #161616;
      --card: #1e1e1e;
      --border: #2e2e2e;
      --text: #f0ede8;
      --muted: #888;
      --accent: #ffcc00;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Oswald', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--display);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- HEADER --- */
    header {
      background: var(--red);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(226,0,26,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: white;
      color: var(--red);
      font-family: var(--display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      padding: 4px 10px;
      border-radius: 3px;
    }

    .logo-title {
      font-family: var(--display);
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: white;
      opacity: 0.9;
    }

    .clock {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 400;
      color: white;
      letter-spacing: 2px;
    }

    /* --- MAIN --- */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      padding-left: 4px;
    }

    /* --- STATION GRID --- */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .station-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.18s ease;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .station-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--red);
      transform: scaleY(0);
      transition: transform 0.18s ease;
    }

    .station-btn:hover,
    .station-btn.active {
      border-color: var(--red);
      background: #252525;
      transform: translateX(2px);
    }

    .station-btn:hover::before,
    .station-btn.active::before {
      transform: scaleY(1);
    }

    .station-btn.active {
      background: #221010;
    }

    .station-icon {
      width: 36px;
      height: 36px;
      background: var(--red);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .station-info {
      flex: 1;
      min-width: 0;
    }

    .station-name {
      font-family: var(--display);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-eva {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .station-arrow {
      color: var(--muted);
      font-size: 14px;
      transition: color 0.18s;
    }

    .station-btn:hover .station-arrow,
    .station-btn.active .station-arrow {
      color: var(--red);
    }

    /* --- FRAME WRAPPER --- */
    .frame-wrapper {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .frame-wrapper.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .frame-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .frame-station-name {
      font-family: var(--display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .frame-station-name span {
      color: var(--red);
    }

    .open-btn {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .open-btn:hover {
      color: var(--text);
      border-color: var(--red);
      background: #221010;
    }

    .iframe-container {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: white;
      position: relative;
    }

    .iframe-container iframe {
      width: 100%;
      height: 640px;
      border: none;
      display: block;
    }

    /* Overlay hint for iframe interaction on mobile */
    .iframe-hint {
      display: none;
      text-align: center;
      padding: 10px;
      background: #111;
      border-top: 1px solid var(--border);
    }

    .iframe-hint a {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 1px;
    }

    /* --- FOOTER --- */
    footer {
      text-align: center;
      padding: 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
      header { height: 54px; }
      .logo-title { display: none; }
      .clock { font-size: 18px; }

      .stations-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .station-btn {
        padding: 12px 14px;
        gap: 10px;
      }

      .station-icon { width: 30px; height: 30px; font-size: 14px; }
      .station-name { font-size: 13px; }
      .station-arrow { display: none; }

      .frame-station-name { font-size: 17px; }

      .iframe-container iframe { height: 75vh; }
      .iframe-hint { display: block; }

      main { padding: 20px 12px 40px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">ÖBB</div>
    <div class="logo-title">Abfahrtszeiten</div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <p class="section-label">Bahnhof auswählen</p>

  <div class="stations-grid">
    <button class="station-btn" data-eva="8100349" data-name="Wien Praterstern" onclick="selectStation(this)">
      <div class="station-icon">🚉</div>
      <div class="station-info">
        <div class="station-name">Wien Praterstern</div>
        <div class="station-eva">EVA · 8100349</div>
      </div>
      <div class="station-arrow">›</div>
    </button>

    <button class="station-btn" data-eva="8100003" data-name="Wien Westbahnhof" onclick="selectStation(this)">
      <div class="station-icon">🚂</div>
      <div class="station-info">
        <div class="station-name">Wien Westbahnhof</div>
        <div class="station-eva">EVA · 8100003</div>
      </div>
      <div class="station-arrow">›</div>
    </button>

    <button class="station-btn" data-eva="8103000" data-name="Wien Hauptbahnhof" onclick="selectStation(this)">
      <div class="station-icon">🏛️</div>
      <div class="station-info">
        <div class="station-name">Wien Hbf</div>
        <div class="station-eva">EVA · 8103000</div>
      </div>
      <div class="station-arrow">›</div>
    </button>

    <button class="station-btn" data-eva="8100414" data-name="Salzburg Hauptbahnhof" onclick="selectStation(this)">
      <div class="station-icon">🏔️</div>
      <div class="station-info">
        <div class="station-name">Salzburg Hbf</div>
        <div class="station-eva">EVA · 8100414</div>
      </div>
      <div class="station-arrow">›</div>
    </button>

    <button class="station-btn" data-eva="8100014" data-name="Wels Hauptbahnhof" onclick="selectStation(this)">
      <div class="station-icon">🚆</div>
      <div class="station-info">
        <div class="station-name">Wels Hbf</div>
        <div class="station-eva">EVA · 8100014</div>
      </div>
      <div class="station-arrow">›</div>
    </button>
  </div>

  <div class="frame-wrapper" id="frameWrapper">
    <div class="frame-header">
      <div class="frame-station-name" id="frameTitle">—</div>
      <a class="open-btn" id="openBtn" href="#" target="_blank">↗ ÖBB öffnen</a>
    </div>
    <div class="iframe-container">
      <iframe id="departureFrame" src="" title="ÖBB Abfahrtszeiten" allowfullscreen></iframe>
      <div class="iframe-hint">
        <a id="mobileLink" href="#" target="_blank">📱 In ÖBB-App öffnen →</a>
      </div>
    </div>
  </div>
</main>

<footer>ÖBB ECHTZEIT-ABFAHRTEN · DATEN VON MEINE.ÖBB.AT</footer>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Station selection
  function selectStation(btn) {
    // Deactivate all
    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const eva = btn.dataset.eva;
    const name = btn.dataset.name;
    const url = `https://meine.oebb.at/abfahrtankunft/departure?evaNr=${eva}`;

    document.getElementById('frameTitle').innerHTML =
      name.replace(/(\s)(Hbf|Westbahnhof|Praterstern)/, ' <span>$2</span>');

    document.getElementById('openBtn').href = url;
    document.getElementById('mobileLink').href = url;
    document.getElementById('departureFrame').src = url;

    const wrapper = document.getElementById('frameWrapper');
    wrapper.classList.remove('visible');
    // Force reflow for animation replay
    void wrapper.offsetWidth;
    wrapper.classList.add('visible');

    // Smooth scroll to frame on mobile
    if (window.innerWidth < 600) {
      setTimeout(() => {
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }
  }

  // Auto-select first station on load
  window.addEventListener('load', () => {
    const first = document.querySelector('.station-btn');
    if (first) selectStation(first);
  });
</script>
</body>
</html>
