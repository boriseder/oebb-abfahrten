<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ÖBB Live-Abfahrten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #E2001A;
      --red-dark: #b5001a;
      --black: #0d0d0d;
      --panel: #161616;
      --card: #1e1e1e;
      --border: #2e2e2e;
      --text: #f0ede8;
      --muted: #888;
      --accent: #ffcc00;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Oswald', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--display);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.4;
    }

    /* --- HEADER --- */
    header {
      background: var(--red);
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-badge {
      background: white;
      color: var(--red);
      font-weight: 700;
      font-size: 16px;
      padding: 2px 8px;
      border-radius: 2px;
    }

    .clock {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      color: white;
    }

    /* --- MAIN --- */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 15px 10px 40px;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* --- STATION GRID --- */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .station-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s ease;
      text-align: left;
    }

    .station-btn.active {
      border-color: var(--red);
      background: #2a1515;
      box-shadow: inset 0 0 10px rgba(226,0,26,0.2);
    }

    .station-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .station-eva {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
    }

    /* --- FRAME AREA --- */
    .frame-wrapper {
      display: none;
      margin-top: 5px;
    }

    .frame-wrapper.visible { display: block; }

    .frame-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      background: var(--panel);
      padding: 8px;
      border-radius: 6px;
    }

    .frame-station-name { font-size: 18px; font-weight: 600; }
    .frame-station-name span { color: var(--red); }

    .open-btn {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* Iframe Container mit Mobile-Zoom */
    .iframe-container {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      height: 70vh; /* Nutzt mehr Platz auf dem Handy */
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Optimierung für sehr schmale Bildschirme */
    @media (max-width: 600px) {
      .stations-grid { grid-template-columns: 1fr 1fr; }
      
      /* Trick: Skaliere den Iframe-Inhalt, damit er auf Mobile besser passt */
      .iframe-container iframe {
          width: 125%;
          height: 125%;
          transform: scale(0.8);
          transform-origin: 0 0;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">ÖBB</div>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <p class="section-label">Station wählen</p>

  <div class="stations-grid">
    <button class="station-btn" data-id="8102801" data-name="Wien Praterstern" onclick="selectStation(this)">
      <span class="station-name">Praterstern</span>
      <span class="station-eva">ID 8102801</span>
    </button>

    <button class="station-btn" data-id="8101003" data-name="Wien Westbahnhof" onclick="selectStation(this)">
      <span class="station-name">Westbahnhof</span>
      <span class="station-eva">ID 8101003</span>
    </button>

    <button class="station-btn" data-id="8101003" data-name="Wien Hauptbahnhof" onclick="selectStation(this)">
      <span class="station-name">Wien Hbf</span>
      <span class="station-eva">ID 8101003</span>
    </button>

    <button class="station-btn" data-id="8101114" data-name="Salzburg Hauptbahnhof" onclick="selectStation(this)">
      <span class="station-name">Salzburg Hbf</span>
      <span class="station-eva">ID 8101114</span>
    </button>

    <button class="station-btn" data-id="8101081" data-name="Wels Hauptbahnhof" onclick="selectStation(this)">
      <span class="station-name">Wels Hbf</span>
      <span class="station-eva">ID 8101081</span>
    </button>
  </div>

  <div class="frame-wrapper" id="frameWrapper">
    <div class="frame-header">
      <div class="frame-station-name" id="frameTitle">—</div>
      <a class="open-btn" id="openBtn" href="#" target="_blank">EXTERN ↗</a>
    </div>
    <div class="iframe-container">
      <iframe id="departureFrame" src="" title="ÖBB Abfahrten"></iframe>
    </div>
  </div>
</main>

<footer>DATEN: MEINE.OEBB.AT</footer>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function selectStation(btn) {
    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const id = btn.dataset.id;
    const name = btn.dataset.name;
    // Neues URL Schema
    const url = `https://meine.oebb.at/webdisplay/?stationId=${id}&contentType=departure&staticLayout=true&page=1&offset=0&ignoreIncident=false&expandAll=false`;

    document.getElementById('frameTitle').innerHTML = name.replace(/(Hbf|Westbahnhof|Praterstern)/, '<span>$1</span>');
    document.getElementById('openBtn').href = url;
    
    const frame = document.getElementById('departureFrame');
    frame.src = url;

    const wrapper = document.getElementById('frameWrapper');
    wrapper.classList.add('visible');

    // Scroll-Assist für Mobile
    if (window.innerWidth < 600) {
      setTimeout(() => {
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 300);
    }
  }

  window.addEventListener('load', () => {
    const first = document.querySelector('.station-btn');
    if (first) selectStation(first);
  });
</script>
</body>
</html>
